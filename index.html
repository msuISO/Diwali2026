<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security policy: only run scripts from this site, fonts from Google, no forms on this page -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https:; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diwali Night | Indian Students' Organisation at MSU</title>
  <meta name="description" content="Friday, November 6, 7–10 pm at the MSU Union Ballroom. Dinner and music by DJ Amped. Tier 2 tickets on sale now.">
  <meta name="theme-color" content="#231b2e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Diwali Night with ISO at MSU">
  <meta property="og:description" content="Friday, November 6, 7–10 pm at the MSU Union Ballroom. Dinner and music by DJ Amped. Tier 2 tickets on sale now.">
  <meta property="og:url" content="https://msuiso.github.io/Diwali2026/">
  <meta property="og:image" content="https://msuiso.github.io/Diwali2026/flyer.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2331263d'/><path d='M16 5c3 4 3.6 7.5 0 11-3.6-3.5-3-7 0-11z' fill='%23d9782f'/><path d='M5 17c1.5 6 20.5 6 22 0z' fill='%23c9a45c'/></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap">
  <style>
    :root{
      --ink:#231b2e;          /* page: dusky aubergine night */
      --plum:#31263d;         /* invitation card */
      --zari:#c9a45c;         /* antique gold */
      --zari-deep:#8a6a2c;    /* gold for text on white */
      --paper:#fffdf8;        /* reply card, close to Omella's white */
      --text:#efe7da;
      --muted:#b5a9bb;
      --paper-text:#2a2133;
      --paper-muted:#6b5f70;
      --rule-dark:rgba(201,164,92,.28);
      --rule-paper:rgba(138,106,44,.25);
      --serif:"Tiro Devanagari Hindi",Georgia,serif;
      --sans:Mukta,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html{background:var(--ink);scroll-behavior:smooth}
    body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration-color:var(--zari);text-decoration-thickness:1px;text-underline-offset:3px}
    a:hover{color:var(--zari)}
    a:focus-visible{outline:2px solid var(--zari);outline-offset:3px;border-radius:2px}

    /* Layout: one column on phones, invitation + reply card side by side on laptops */
    .wrap{max-width:40rem;margin:0 auto;padding:0 16px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"invite" "tickets" "meaning";row-gap:64px}

    /* Invitation card with arched top */
    .invite{grid-area:invite;display:flow-root;position:relative;margin-top:120px;padding:0 24px 36px;background:var(--plum);border:2px solid var(--zari);border-top:0;text-align:center}
    .arch{position:absolute;left:-1px;bottom:calc(100% - 1px);width:calc(100% + 2px);height:104px;overflow:visible}
    .arch-fill{fill:var(--plum)}
    .arch-line{fill:none;stroke:var(--zari);stroke-width:2;vector-effect:non-scaling-stroke}
    .invite-body{position:relative}
    .crest{width:76px;height:76px;margin:-58px auto 18px;border-radius:50%;background:var(--paper);border:2px solid var(--zari);display:grid;place-items:center;overflow:hidden}
    .crest img{width:84%;height:84%;object-fit:contain}
    .host{margin:0;font-family:var(--serif);font-style:italic;font-size:1.125rem;line-height:1.4;color:var(--muted)}
    h1{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(3rem,13vw,4.75rem);line-height:1.05;color:var(--zari)}

    /* Row of lamps: the one animated moment */
    .lamps{display:block;width:100%;height:auto;margin:20px 0 8px}
    .lamp .glow{fill:url(#lampGlow);opacity:0;animation:glow 1.2s ease-out forwards;animation-delay:calc(.5s + var(--i) * .16s)}
    .lamp .flame{fill:url(#lampFlame);opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:light .5s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(.5s + var(--i) * .16s)}
    @keyframes light{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
    @keyframes glow{to{opacity:1}}

    .details{margin:20px 0 0}
    .details div+div{margin-top:18px}
    .details dt{font-family:var(--serif);font-style:italic;font-size:1.0625rem;line-height:1.3;color:var(--zari)}
    .details dd{margin:2px 0 0;font-size:1.125rem;line-height:1.45}
    .soon{display:block;font-size:.9375rem;color:var(--muted)}
    .buy{display:inline-block;margin-top:28px;padding:13px 32px;border-radius:4px;background:var(--zari);color:var(--ink);font-weight:600;font-size:1.0625rem;text-decoration:none}
    .buy:hover{background:#d8b674;color:var(--ink)}
    .buy:active{transform:translateY(1px)}
    .cal{display:table;margin:16px auto 0;font-size:.9375rem}

    /* Reply card holding the Omella checkout */
    .tickets{grid-area:tickets;scroll-margin-top:16px;padding:28px 22px 22px;background:var(--paper);color:var(--paper-text);box-shadow:inset 0 0 0 7px var(--paper),inset 0 0 0 8px var(--zari)}
    .tickets h2{margin:0;font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1.15}
    .tickets a{text-decoration-color:var(--zari-deep)}
    .tickets a:hover{color:var(--zari-deep)}
    .tiers{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--rule-paper)}
    .tiers li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--rule-paper)}
    .tiers .sold{color:var(--paper-muted)}
    .tiers .open .status{color:var(--zari-deep);font-weight:600}
    .note{margin:14px 0 0;font-size:.9375rem;color:var(--paper-muted)}
    .checkout{margin-top:18px}
    .checkout iframe{display:block;width:100%;height:900px;border:0}
    .fineprint{margin:12px 0 0;font-size:.875rem;color:var(--paper-muted)}

    /* The meaning of the word */
    .meaning{grid-area:meaning}
    .deva{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(3.25rem,12vw,4.25rem);line-height:1.3;color:var(--zari)}
    .gloss{margin:2px 0 0;font-family:var(--serif);font-size:1.1875rem;line-height:1.45}
    .text{margin:14px 0 0;max-width:34em}

    footer{margin-top:72px;padding:22px 0 48px;border-top:1px solid var(--rule-dark);font-size:.9375rem;color:var(--muted)}
    footer p{margin:0}
    footer p+p{margin-top:4px}

    @media (max-width:480px){
      .invite{margin-top:100px;padding:0 18px 32px}
      .arch{height:88px}
      .crest{width:68px;height:68px;margin-top:-50px}
      .tickets{padding:24px 16px 18px}
    }
    @media (min-width:960px){
      .wrap{max-width:72rem;padding:0 40px}
      .layout{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"invite tickets" "meaning tickets";column-gap:72px;align-items:start}
      .invite{margin-top:136px;padding:0 40px 44px}
      .arch{height:120px}
      .crest{width:84px;height:84px;margin-top:-66px}
      h1{font-size:4.5rem}
      .buy{display:none}
      .cal{margin-top:28px}
      .tickets{margin-top:16px;padding:36px 34px 28px}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .lamp .flame,.lamp .glow{animation:none;opacity:1}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="layout">

      <article class="invite">
        <svg class="arch" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <path class="arch-fill" d="M0 40V26C0 12 34 8 50 0C66 8 100 12 100 26V40Z"/>
          <path class="arch-line" d="M0 40V26C0 12 34 8 50 0C66 8 100 12 100 26V40"/>
        </svg>

          <p class="host">The Indian Students&rsquo; Organisation at MSU invites you to</p>

          <svg class="lamps" viewBox="0 0 540 60" aria-hidden="true">
            <defs>

              <g id="bowl">
                <path d="M23 48.5h14l-1.5 4.5h-11z" fill="#8a6a2c"/>
                <path d="M7 38C11 53 49 53 53 38Z" fill="url(#lampBrass)"/>
                <ellipse cx="30" cy="38" rx="23" ry="4.5" fill="#dcc08a"/>
                <ellipse cx="30" cy="38.5" rx="19" ry="3" fill="#2e1d0c"/>
              </g>
            </defs>
            <g class="lamp" style="--i:0"><circle class="glow" cx="30" cy="27" r="24"/><use href="#bowl"/><path class="flame" d="M30 12C36 22 37 30 30
